name: CICD

on:
 workflow_dispatch: 


jobs:
  Clone:
    runs-on: ubuntu-latest#
    steps:
      - name: clone the code
        run: echo " Clone"

  Compile:
   needs: [Clone]
   runs-on: ubuntu-latest
   steps:
      - name: Compile the code
        run: echo "Compile"

  Build:
   needs: [Compile]
   runs-on: ubuntu-24.04-arm
   steps:
     - name: Build the code using docker
       run: echo " Build the using Docker"

  Test:
   needs: [Build]
   runs-on: ubuntu-latest
   steps:
      - name: Running Test cases
        run: echo " Unit Test"

  deploy:
    needs: [Test]
    runs-on: ubuntu-latest
    steps:
      - name: Deploy the app in k8s
        run: echo " Deploy app in the production"
